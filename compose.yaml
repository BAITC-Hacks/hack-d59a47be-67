services:
  backend:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_PATH: /data/career_quest.sqlite3
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://127.0.0.1:8000","http://localhost:8000","http://localhost:5173"]}'
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      SQLITE_WAL: "false"
      SQLITE_LOCAL_DISK: "false"
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-6.0}
    volumes:
      - sqlite_data:/data
    deploy:
      replicas: 1
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sqlite_data:
