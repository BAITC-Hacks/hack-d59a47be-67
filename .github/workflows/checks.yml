name: Backend and architecture checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check backend scripts/smoke.py scripts/check_contracts.py
      - run: python scripts/check_contracts.py
      - name: Require AGENTS journal in pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_agent_log.py --base "$BASE_SHA"
