# Isolated public-demo mode on localhost. Use this file alone, not as a compose.yaml override.
services:
  web:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    ports:
      - "127.0.0.1:8080:8000"
    environment:
      APP_ENV: development
      PUBLIC_DEMO_MODE: "true"
      COOKIE_SECURE: "false"
      DATABASE_PATH: /data/career_quest.sqlite3
      STATIC_FILES_PATH: /app/frontend/dist
      PORT: "8000"
      ALLOWED_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080"]'
      SESSION_TTL_SECONDS: "3600"
      SQLITE_WAL: "false"
      SQLITE_LOCAL_DISK: "false"
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-6.0}
    # No host data/kit mounts and no persistent volume: this is a disposable demonstration.
    deploy:
      replicas: 1
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
