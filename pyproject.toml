[project]
name = "career-quest-backend"
version = "1.0.0"
description = "Career Quest single-process demo backend"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "pydantic==2.13.5", "uvicorn==0.53.0", "python-dotenv==1.2.3"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
